name: curatin-planet
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-curatin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      POSTGRES_DB: ${POSTGRES_DB:-curatin}
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-25432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:${REDIS_HOST_PORT:-26379}:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MinIO access key}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MinIO secret key}
    ports: ["127.0.0.1:${MINIO_HOST_PORT:-29000}:9000", "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-29001}:9001"]
    volumes: ["minio-data:/data"]
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on: [minio]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-curatin-media}
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        for i in $$(seq 1 30); do
          if mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; then
            mc mb --ignore-existing "local/$$MINIO_BUCKET"
            exit 0
          fi
          sleep 2
        done
        exit 1
  migrate:
    build: {context: ., dockerfile: Dockerfile.api}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-curatin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-curatin}
    command: ["npm", "run", "db:migrate"]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: {context: ., dockerfile: Dockerfile.api}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-curatin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-curatin}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      PORT: 4000
    ports: ["127.0.0.1:${API_HOST_PORT:-24000}:4000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
  web:
    build: {context: ., dockerfile: Dockerfile.web, args: {API_INTERNAL_URL: "http://api:4000"}}
    ports: ["127.0.0.1:${WEB_HOST_PORT:-23000}:3000"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres-data:
  redis-data:
  minio-data:


