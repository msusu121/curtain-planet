name: Quality checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      test-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: curtain_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: curtain_test
        ports:
          - 25433:5432
        options: >-
          --health-cmd "pg_isready -U curtain_test -d curtain_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run db:generate
      - run: npm run test:http
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://curtain_test:test-only-password@localhost:25433/curtain_test
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://curtain_test:test-only-password@localhost:25433/curtain_test
      - run: npm run typecheck
      - run: npm run build
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait
      - run: curl --fail http://localhost:24000/health/ready
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down

